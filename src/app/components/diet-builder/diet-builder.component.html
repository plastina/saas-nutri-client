<h3 class="section-title builder-title" *ngIf="meals.length > 0">
  {{ "summary.currentPlan" | t }}
</h3>

<div class="meals-container" *ngIf="meals.length > 0">
  <div
    *ngFor="let meal of meals; let mealIndex = index"
    class="meal-column-card"
    [class.is-target]="meal.name === selectedMealName"
  >
    <p-card class="meal-card">
      <ng-template pTemplate="header">
        <div class="meal-card-header-content">
          <div *ngIf="editingMealIndex !== mealIndex" class="meal-header-view">
            <div class="meal-header-top">
              <h4 class="meal-title">{{ meal.name }}</h4>
              <div class="meal-kcal">
                {{ getMealKcal(meal) | number: "1.0-0" }} kcal
              </div>
            </div>
            <div class="meal-header-actions">
              <span
                *ngIf="meal.name === selectedMealName"
                class="meal-target-flag"
              >
                {{ "builder.currentTarget" | t }}
              </span>
              <button
                *ngIf="meal.name !== selectedMealName"
                pButton
                type="button"
                [label]="'builder.useAsTarget' | t"
                class="meal-target-btn p-button-sm p-button-text"
                (click)="mealTargeted.emit(meal.name)"
                [pTooltip]="
                  'builder.useAsTargetAria' | t: { mealName: meal.name }
                "
                tooltipPosition="top"
                [attr.aria-label]="
                  'builder.useAsTargetAria' | t: { mealName: meal.name }
                "
              ></button>
              <span class="meal-header-icons">
                <button
                  pButton
                  type="button"
                  [label]="'builder.edit' | t"
                  class="meal-edit-btn p-button-sm p-button-text"
                  (click)="startEditMeal(mealIndex, meal.name)"
                  [pTooltip]="'builder.editMeal' | t"
                  tooltipPosition="top"
                  [attr.aria-label]="'builder.editMeal' | t"
                ></button>
                <button
                  pButton
                  type="button"
                  [label]="'builder.delete' | t"
                  class="meal-delete-btn p-button-sm p-button-danger p-button-text"
                  (click)="deleteMeal(mealIndex)"
                  [pTooltip]="'builder.deleteMeal' | t"
                  tooltipPosition="top"
                  [attr.aria-label]="'builder.deleteMeal' | t"
                ></button>
              </span>
            </div>
          </div>
          <div
            *ngIf="editingMealIndex === mealIndex"
            class="meal-header-edit p-inputgroup"
          >
            <input
              pInputText
              type="text"
              [(ngModel)]="editedMealName"
              [placeholder]="'builder.newName' | t"
              (keydown.enter)="saveEditMeal(mealIndex)"
              class="p-inputtext-sm edit-meal-name-input"
            />
            <button
              pButton
              type="button"
              icon="pi pi-check"
              class="meal-save-btn p-button-sm p-button-success p-button-text"
              (click)="saveEditMeal(mealIndex)"
              [pTooltip]="'builder.save' | t"
              tooltipPosition="top"
              [attr.aria-label]="'builder.saveNewName' | t"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-times"
              class="meal-cancel-btn p-button-sm p-button-secondary p-button-text"
              (click)="cancelEditMeal()"
              [pTooltip]="'builder.cancel' | t"
              tooltipPosition="top"
              [attr.aria-label]="'builder.cancelEdit' | t"
            ></button>
          </div>
        </div>
      </ng-template>
      <ng-template pTemplate="content">
        <div class="meal-items-list">
          <div
            *ngFor="let item of meal.items; let itemIndex = index"
            class="diet-item"
          >
            <div
              class="item-name heading-xs"
              [pTooltip]="item.food.name"
              tooltipPosition="top"
            >
              {{ item.food.name }}
            </div>

            <div class="item-qty" [attr.data-label]="'builder.quantity' | t">
              <p-inputNumber
                [(ngModel)]="item.displayQuantity"
                (ngModelChange)="onItemInputChange(mealIndex, itemIndex)"
                inputId="'displayQty-' + mealIndex + '-' + itemIndex"
                mode="decimal"
                [min]="0"
                [step]="0.5"
                [showButtons]="true"
                buttonLayout="horizontal"
                incrementButtonIcon="pi pi-plus"
                decrementButtonIcon="pi pi-minus"
                [minFractionDigits]="0"
                [maxFractionDigits]="1"
                class="meal-item-quantity-input p-inputtext-sm"
              ></p-inputNumber>
            </div>

            <div class="item-measure" [attr.data-label]="'builder.measure' | t">
              <p-select
                [placeholder]="'builder.measure' | t"
                class="meal-item-measure-dropdown p-inputtext-sm"
                appendTo="body"
                [options]="item.measures"
                [(ngModel)]="item.selectedMeasure"
                (ngModelChange)="onItemInputChange(mealIndex, itemIndex)"
                optionLabel="measure_name"
                optionValue="measure_name"
              ></p-select>
            </div>

            <div class="item-kcal" [attr.data-label]="'summary.calories' | t">
              {{ getItemKcal(item) | number: "1.0-0" }} kcal
            </div>

            <div class="item-actions">
              <button
                pButton
                type="button"
                icon="pi pi-times"
                class="item-remove-btn p-button-sm p-button-danger p-button-text"
                (click)="removeFoodFromDiet(mealIndex, itemIndex)"
                [pTooltip]="'builder.removeItem' | t"
                tooltipPosition="top"
                [attr.aria-label]="'builder.removeItem' | t"
              ></button>
            </div>
          </div>
          <div
            *ngIf="!meal.items || meal.items.length === 0"
            class="empty-meal-message"
          >
            <i>{{ "builder.emptyMeal" | t }}</i>
          </div>
        </div>
      </ng-template>
    </p-card>
  </div>
</div>

<p *ngIf="!meals || meals.length === 0" class="builder-no-meals">
  {{ "builder.noMeals" | t }}
</p>

<div class="add-meal-row">
  <button
    *ngIf="!addingMeal"
    type="button"
    class="add-meal-btn"
    (click)="startAddMeal()"
  >
    <i class="pi pi-plus" aria-hidden="true"></i>
    {{ "builder.addMeal" | t }}
  </button>

  <div *ngIf="addingMeal" class="add-meal-form p-inputgroup">
    <input
      pInputText
      type="text"
      [(ngModel)]="newMealName"
      [placeholder]="'meal.new.placeholder' | t"
      (keydown.enter)="confirmAddMeal()"
      (keydown.escape)="cancelAddMeal()"
      class="p-inputtext-sm"
    />
    <button
      pButton
      type="button"
      icon="pi pi-check"
      class="p-button-sm p-button-success p-button-text"
      (click)="confirmAddMeal()"
      [attr.aria-label]="'meal.addAria' | t"
    ></button>
    <button
      pButton
      type="button"
      icon="pi pi-times"
      class="p-button-sm p-button-secondary p-button-text"
      (click)="cancelAddMeal()"
      [attr.aria-label]="'builder.cancel' | t"
    ></button>
  </div>
</div>
