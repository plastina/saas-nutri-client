<p-toast></p-toast>
<p-confirmDialog icon="pi pi-exclamation-triangle"></p-confirmDialog>

<header class="app-header">
  <div class="container app-header__container">
    <div class="app-header__brand">
      <h1 class="app-header__title">{{ "header.title" | t }}</h1>
      <p class="app-header__subtitle">
        {{ "header.subtitle" | t }}
      </p>

      <div class="app-header__meta">
        <span class="meta-chip">
          <i class="pi pi-save"></i>
          {{ "header.autosave" | t }}
        </span>
        <span class="meta-chip" [class.is-active]="hasItemsInAnyMeal">
          <i class="pi pi-chart-line"></i>
          {{
            hasItemsInAnyMeal
              ? ("header.progress.inProgress" | t)
              : ("header.progress.new" | t)
          }}
        </span>
      </div>
    </div>

    <nav class="app-header__actions" [attr.aria-label]="'header.actions' | t">
      <p-select
        [options]="languageOptions"
        [(ngModel)]="currentLanguage"
        (ngModelChange)="changeLanguage($event)"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        [ariaLabel]="'header.languageAria' | t"
      >
        <ng-template pTemplate="selectedItem" let-selectedOption>
          <span *ngIf="selectedOption"
            >{{ selectedOption.flag }} {{ selectedOption.label }}</span
          >
        </ng-template>
        <ng-template pTemplate="item" let-option>
          <span>{{ option.flag }} {{ option.label }}</span>
        </ng-template>
      </p-select>

      <button
        pButton
        type="button"
        [icon]="currentTheme === 'light' ? 'pi pi-moon' : 'pi pi-sun'"
        (click)="toggleTheme()"
        class="theme-toggle-btn"
        [pTooltip]="'header.themeToggle' | t"
        tooltipPosition="bottom"
        [attr.aria-label]="'header.themeToggle' | t"
      ></button>
    </nav>
  </div>
</header>

<main class="container">
  <app-patient-section
    [patientData]="patientSessionData"
    [startExpanded]="patientPanelExpanded"
    (patientDataChange)="onPatientDataChange()"
  ></app-patient-section>

  <div class="editor-shell">
    <div class="editor-primary">
      <app-meal-management
        [selectedMealName]="selectedMealName"
        [foodSearchSuggestions]="foodSearchSuggestions"
        [selectedFoodAutoComplete]="selectedFoodAutoComplete"
        (foodSearch)="searchFoodsByTerm($event)"
        (foodSelected)="addFoodToActiveMeal($event)"
      ></app-meal-management>

      <app-diet-builder
        [meals]="meals"
        [selectedMealName]="selectedMealName"
        (itemRemoved)="handleRemoveFood($event)"
        (itemChanged)="handleItemChange($event)"
        (mealNameChanged)="handleMealNameChange($event)"
        (mealDeleted)="handleMealDelete($event)"
        (mealTargeted)="selectedMealName = $event"
        (mealAdded)="addMeal($event)"
      ></app-diet-builder>
    </div>

    <app-plan-summary
      class="editor-rail"
      [meals]="meals"
      [hasItemsInAnyMeal]="hasItemsInAnyMeal"
      [totalKcal]="totalKcal"
      [totalProtein]="totalProtein"
      [totalCarbs]="totalCarbs"
      [totalFat]="totalFat"
      [totalFiber]="totalFiber"
      (exportToJson)="exportToJson()"
      (exportToPdf)="exportPlanToPdf()"
      (importFromFile)="handleFileInput($event)"
    ></app-plan-summary>
  </div>
</main>
